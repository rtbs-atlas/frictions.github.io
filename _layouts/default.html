<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Frictions, home">frictions</a>
    <span class="header-edition">A symposium<br>1–5 March 2027</span>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}#about">About</a>
      <a href="{{ '/schedule/' | relative_url }}"{% if page.url == '/schedule/' %} aria-current="page"{% endif %}>Schedule <span aria-hidden="true">↗</span></a>
      <a href="{{ '/' | relative_url }}#calls"{% if page.url contains '/calls/' %} aria-current="page"{% endif %}>Calls</a>
      <a href="{{ '/participants/' | relative_url }}"{% if page.url == '/participants/' %} aria-current="page"{% endif %}>Participants</a>
    </nav>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <a class="footer-logo" href="{{ '/' | relative_url }}">frictions</a>
    <p>Science-Making at the Intersections of<br>Art, Ecology and Architecture</p>
    <p>2027 Symposium<br><span>1–5 March 2027</span></p>
    <a href="#main">Back to top ↑</a>
  </footer>
</body>
</html>
